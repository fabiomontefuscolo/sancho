      - paragraph [ref=e26]: "--- name: strudel description: This skill should be used when working with Strudel.cc, a live-coding music environment. Use when creating musical patterns, drum sequences, melodies, basslines, or generative compositions. The user will always want to run Strudel code in the browser, either by copy-pasting or by providing a clickable URL with the code encoded in base64. --- # Strudel ## Overview Strudel is a browser-based live-coding environment that ports TidalCycles' pattern language to JavaScript. It uses pure functional programming to create musical patterns that can include drums, melodies, synthesis, and effects. Patterns are immutable query functions that transform time spans into event streams, supporting mini-notation DSL, Euclidean rhythms, and extensive audio processing. ## When to Use This Skill Use this skill when: - Creating drum patterns, melodies, basslines, or full compositions - Generating algorithmic or generative music - Applying effects like filters, reverb, delay, or distortion - Debugging Strudel code or explaining pattern behavior - Encoding Strudel code into shareable URLs ## Core Workflow ### 1. Understanding the User's Musical Intent When a user requests a pattern, clarify: - **Genre/style** (techno, ambient, jazz, etc.) - **Artist references** (Lorn, Clams Casino, Aphex Twin, etc.) - **Tempo** (BPM or cycles per minute) - **Elements needed** (drums only, drums + bass, full arrangement) - **Complexity level** (simple loop vs. generative/evolving) **For genre/artist-specific techniques**, consult `references/genre-styles.md` which provides: - Sonic characteristics for common genres and artists - Strudel implementation patterns - Concrete code examples for each style - Typical tempo ranges, effects, and structural elements ### 2. Writing the Pattern Build patterns using Strudel's functional, compositional approach: **Basic structure:** ```javascript // Simple drum pattern s(\"bd hh sd hh\") // With tempo s(\"bd hh sd hh\").cpm(120) // Layered with stack stack( s(\"bd(3,8)\"), // Kick drum s(\"hh*8\"), // Hi-hats s(\"~ sd ~ sd\") // Snare on backbeat ).cpm(120) ``` **Key patterns:** - Use mini-notation (`\"bd hh sd\"`) for concise rhythm specification - Use `stack()` to layer multiple patterns - Use `.cpm()` for tempo in cycles per minute - Use Euclidean rhythms `(pulses, steps)` for interesting distributions - Use lambda functions for transformations: `.off(1/8, x => x.add(7))`"
